<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="个人数字名片 - 个人经历与在线工具作品集" />
  <title>个人数字名片</title>

  <!--
    TailwindCSS（CDN 版，用于静态演示，免构建）。
    注意：CDN 版仅供开发/演示，生产环境建议改为编译产物或本地化，避免依赖外网。
  -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 自定义样式：时间线、卡片动效、标签筛选器等组件级样式 -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-slate-50 text-slate-800 antialiased">

  <!-- ===================== 导航头部 ===================== -->
  <header class="sticky top-0 z-50 border-b border-slate-200 bg-white/80 backdrop-blur">
    <nav class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4">
      <!-- 姓名（由 data.js 的 PROFILE 动态渲染） -->
      <a href="#top" id="header-name" class="text-lg font-semibold tracking-tight text-slate-900"></a>
      <!-- 站内导航锚点 -->
      <div class="hidden gap-6 text-sm font-medium text-slate-600 sm:flex">
        <a href="#timeline" class="transition hover:text-indigo-600">个人经历</a>
        <a href="#tools" class="transition hover:text-indigo-600">作品集</a>
      </div>
    </nav>
  </header>

  <!-- ===================== 主体 ===================== -->
  <main id="top" class="mx-auto max-w-5xl px-4 pb-20">

    <!-- 首屏：姓名 + 简短个人介绍 -->
    <section class="py-16 text-center sm:py-20">
      <!-- 头像占位：取姓名首字 -->
      <div id="hero-avatar"
           class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-indigo-600 text-2xl font-bold text-white shadow-lg shadow-indigo-200"></div>
      <h1 id="hero-name" class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl"></h1>
      <p id="hero-intro" class="mx-auto mt-4 max-w-2xl text-base leading-relaxed text-slate-500"></p>
    </section>

    <!-- ===================== 模块1：个人经历时间线 ===================== -->
    <section id="timeline" class="scroll-mt-20">
      <h2 class="mb-8 text-2xl font-bold text-slate-900">个人经历</h2>
      <!-- 时间线内容由 main.js 动态渲染（空数据时渲染空状态提示） -->
      <div id="timeline-container"></div>
    </section>

    <!-- ===================== 模块2：作品集 · 在线工具（可交互） ===================== -->
    <section id="tools" class="mt-20 scroll-mt-20">
      <h2 class="text-2xl font-bold text-slate-900">作品集 · 在线工具</h2>
      <p class="mt-2 text-sm text-slate-500">个人工具开发实践，全部可在线直接使用。</p>
      <div class="mt-8 grid grid-cols-1 gap-6 md:grid-cols-2">

        <!-- 工具 1：番茄专注钟 -->
        <div class="tool-card">
          <div class="tool-card__head">
            <span class="tool-card__label">TOOL · 01</span>
            <span class="tool-card__title">番茄专注钟</span>
          </div>

          <div class="tool-modes" role="tablist" aria-label="计时模式">
            <button class="tool-mode active" data-mode="focus">专注</button>
            <button class="tool-mode" data-mode="short">短休息</button>
            <button class="tool-mode" data-mode="long">长休息</button>
          </div>

          <div class="tool-time" id="pomo-time">25:00</div>
          <div class="tool-progress"><div class="tool-progress__bar" id="pomo-bar"></div></div>

          <div class="tool-actions">
            <button id="pomo-start" class="tool-btn tool-btn--primary">开始</button>
            <button id="pomo-reset" class="tool-btn">重置</button>
          </div>
          <p class="tool-stats" id="pomo-stats">已完成 0 个番茄 🍅</p>
        </div>

        <!-- 工具 2：待办清单（进阶版） -->
        <div class="tool-card">
          <div class="tool-card__head">
            <span class="tool-card__label">TOOL · 02</span>
            <span class="tool-card__title">待办清单 · 进阶</span>
          </div>

          <div class="tool-modes" id="todo-filters" role="tablist" aria-label="状态筛选">
            <button class="tool-mode active" data-filter="all">全部</button>
            <button class="tool-mode" data-filter="active">未完成</button>
            <button class="tool-mode" data-filter="done">已完成</button>
          </div>

          <form id="todo-form" class="tool-todo-form">
            <input id="todo-input" type="text" placeholder="添加待办…" autocomplete="off" />
            <select id="todo-priority" class="tool-select" title="优先级">
              <option value="medium">中</option>
              <option value="high">高</option>
              <option value="low">低</option>
            </select>
            <button type="submit" class="tool-btn tool-btn--primary">添加</button>
          </form>

          <ul id="todo-list" class="tool-todo-list"></ul>
          <p class="tool-stats" id="todo-stats"></p>
        </div>

        <!-- 工具 3：Markdown 笔记 -->
        <div class="tool-card">
          <div class="tool-card__head">
            <span class="tool-card__label">TOOL · 03</span>
            <span class="tool-card__title">Markdown 笔记</span>
          </div>

          <div class="note-list-head">
            <span class="note-list-title">全部笔记</span>
            <button id="note-new" class="tool-btn tool-btn--primary tool-btn--sm">新建</button>
          </div>

          <ul id="note-list" class="note-list"></ul>

          <textarea id="note-editor" class="note-editor" placeholder="在这里写 Markdown…" spellcheck="false"></textarea>

          <div class="note-toolbar">
            <button id="note-toggle" class="tool-btn tool-btn--sm">预览</button>
            <span id="note-status" class="note-status"></span>
          </div>

          <div id="note-preview" class="note-preview" hidden></div>
        </div>

        <!-- 工具 4：天气查询 -->
        <div class="tool-card">
          <div class="tool-card__head">
            <span class="tool-card__label">TOOL · 04</span>
            <span class="tool-card__title">天气查询</span>
          </div>

          <form id="weather-form" class="tool-todo-form">
            <input id="weather-input" type="text" placeholder="输入城市名，如：武汉" autocomplete="off" />
            <button type="submit" class="tool-btn tool-btn--primary">查询</button>
            <button id="weather-locate" type="button" class="tool-btn">定位</button>
          </form>

          <div id="weather-body" class="weather-body">
            <p class="weather-hint">输入城市名查询，或点「定位」获取当前位置天气。</p>
          </div>

          <p class="tool-stats" id="weather-status"></p>
        </div>

      </div>
    </section>

  </main>

  <!-- ===================== 页脚 ===================== -->
  <footer class="border-t border-slate-200 bg-white">
    <div class="mx-auto max-w-5xl px-4 py-8 text-center text-sm text-slate-400">
      个人数字名片 · 静态单页 · HTML + TailwindCSS + Vanilla JS
    </div>
  </footer>

  <noscript>
    <p class="p-4 text-center text-red-500">本页面需要启用 JavaScript 才能显示内容。</p>
  </noscript>

  <!--
    脚本分层：
      1. js/data.js  —— 业务数据（后续修改内容只需改这里，无需改动页面结构）
      2. js/main.js  —— 渲染 + 交互逻辑（时间线）
      3. js/tools.js —— 作品集在线工具（番茄钟 / 待办 / 笔记 / 天气）
  -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/tools.js"></script>
</body>
</html>
